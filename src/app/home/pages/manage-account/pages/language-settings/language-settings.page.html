<ion-header>
	<ion-toolbar>
		<ion-back-button slot="start" defaultHref="manage-account"></ion-back-button>
		<ion-title>Language Settings</ion-title>
	</ion-toolbar>
</ion-header>

<ion-content>
	<ion-card>
		<ion-card-header>
			<ion-text class="header">Language settings</ion-text>
			<ion-text class="description"
				>Select and confirm your language. Supported are English and Polish so far.</ion-text
			>
		</ion-card-header>
		<ion-card-content>
			<ion-select
				mode="md"
				fill="outline"
				value="en"
				label="Set language"
				label-placement="floating"
			>
				<ion-icon name="home" slot="start" />
				@for (option of options; track option.value) {
				<ion-select-option [value]="option.value">{{ option.label }}</ion-select-option>
				}
			</ion-select>
		</ion-card-content>
	</ion-card>
</ion-content>

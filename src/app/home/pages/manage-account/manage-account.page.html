<ion-header>
	<ion-toolbar>
		<ion-back-button slot="start" defaultHref="home"></ion-back-button>
		<ion-title appTranslate="manage_account">Manage Account</ion-title>
	</ion-toolbar>
</ion-header>

<ion-content>
	<ion-card class="first-card">
		<ion-card-header>
			<div class="circle">
				<ion-icon name="person" />
			</div>
			@if (isLocalStorageUserFullName) {
			<ion-text>{{ userFullName }}</ion-text>
			} @else {
			<ion-text
				class="error"
				appTranslate="edit_your_user_settings_to_add_the_personal_preferences_to_this_account"
				>Edit your user settings to add the personal preferences to this account.</ion-text
			>
			}
		</ion-card-header>
		<ion-card-content>
			<ion-text appTranslate="manage_your_account_details_here"
				>Manage your account details here.</ion-text
			>
		</ion-card-content>
	</ion-card>
	<ion-card class="second-card">
		<ion-card-content routerLink="language-settings">
			<div class="square">
				<ion-icon name="language" class="first-icon" />
			</div>
			<ion-text appTranslate="language_settings">Language settings</ion-text>
			<ion-icon name="chevron-forward" class="second-icon" />
		</ion-card-content>
		<ion-card-content routerLink="user-settings">
			<div class="square">
				<ion-icon name="people" class="first-icon" />
			</div>
			<ion-text appTranslate="user_settings">User settings</ion-text>
			<ion-icon name="chevron-forward" class="second-icon" />
		</ion-card-content>
		<ion-card-content (click)="alert()">
			<div class="square">
				<ion-icon name="contrast" class="first-icon" />
			</div>
			<ion-text>Theme settings</ion-text>
			<ion-icon name="chevron-forward" class="second-icon" />
		</ion-card-content>
		<ion-card-content (click)="alert()">
			<div class="square">
				<ion-icon name="earth" class="first-icon" />
			</div>
			<ion-text>Global settings</ion-text>
			<ion-icon name="chevron-forward" class="second-icon" />
		</ion-card-content>
	</ion-card>
</ion-content>

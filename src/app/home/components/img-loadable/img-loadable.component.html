@if ((imageLoading$ | async) === false) {
<ion-img
	[src]="imageBlobUrl$ | async"
	[style.height]="height"
	[style.width]="width"
	[style.object-fit]="fit"
/>
} @else {
<div class="spinner-container" [style.height]="height">
	<ion-spinner color="primary" />
</div>
}
<ion-modal [isOpen]="zoomInDialog" (didDismiss)="dismiss.emit(false)">
	<ng-template>
		<ion-content>
			<ion-button class="close-btn" (click)="dismiss.emit(false)">
				<ion-icon name="close-outline" slot="icon-only" />
			</ion-button>
			<ion-img
				[src]="imageBlobUrl$ | async"
				[style.height]="'100%'"
				[style.width]="'100%'"
				class="zoomed-img"
			/>
		</ion-content>
	</ng-template>
</ion-modal>
